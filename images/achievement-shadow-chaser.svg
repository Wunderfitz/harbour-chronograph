  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <circle cx="32" cy="32" r="13" stroke-width="5"/>
    <path stroke-width="4" d="M51.4 40.0 L57.9 42.7 M40.0 51.4 L42.7 57.9 M24.0 51.4 L21.3 57.9 M12.6 40.0 L6.1 42.7 M12.6 24.0 L6.1 21.3 M24.0 12.6 L21.3 6.1 M40.0 12.6 L42.7 6.1 M51.4 24.0 L57.9 21.3"/>
  </g>
  <circle fill="#ffffff" cx="42.5" cy="21.5" r="5"/>
</svg>
