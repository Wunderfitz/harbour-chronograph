<!--
    Cover background for a dark ambience: the app icon's chronograph in a single colour.
    The coordinates inside the group are the icon's own 86-unit ones, scaled
    by 2.6 and centred, so the two drawings stay easy to keep in step. The
    face is an outline here rather than a disc - in one colour a filled disc
    would swallow the marks and the hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="172" height="172" viewBox="0 0 172 172">
  <g transform="translate(86,86) scale(2.6) translate(-43,-41.5)">
    <g fill="#ffffff">
      <rect x="39.5" y="17" width="7" height="8" rx="1.5" ry="1.5"/>
      <rect x="34.5" y="12" width="17" height="7" rx="3.5" ry="3.5"/>
      <rect x="39.5" y="19.5" width="7" height="6.5" rx="1.5" ry="1.5" transform="rotate(-45 43 47)"/>
      <rect x="39.5" y="19.5" width="7" height="6.5" rx="1.5" ry="1.5" transform="rotate(45 43 47)"/>
      <circle cx="43" cy="47" r="3.4"/>
    </g>
    <g stroke="#ffffff" stroke-linecap="round" fill="none">
      <circle cx="43" cy="47" r="22.5" stroke-width="3"/>
      <path d="M 43 29.5 L 43 33.5 M 60.5 47 L 56.5 47 M 43 64.5 L 43 60.5 M 25.5 47 L 29.5 47"
            stroke-width="2.6"/>
      <path d="M 43 47 L 51 33.2" stroke-width="3.6"/>
    </g>
  </g>
</svg>
