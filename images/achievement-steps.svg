  <g fill="#ffffff">
    <ellipse cx="0" cy="0" rx="7.5" ry="11" transform="translate(20 34) rotate(-8)"/>
    <ellipse cx="0" cy="0" rx="5.5" ry="5" transform="translate(22 53) rotate(-8)"/>
    <ellipse cx="0" cy="0" rx="7.5" ry="11" transform="translate(44 14) rotate(8)"/>
    <ellipse cx="0" cy="0" rx="5.5" ry="5" transform="translate(42 33) rotate(8)"/>
  </g>
</svg>
