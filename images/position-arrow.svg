<!--
    The heading on the activity map: an arrowhead pointing up, drawn just
    outside the position's point and turned with the direction of travel. In
    the deep blue of the point, with a white edge to stand out from the map
    the way the point does.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <path d="M16 3 L28 28 L16 22 L4 28 Z" fill="#1472a0" stroke="#ffffff" stroke-width="2.5"
        stroke-linejoin="round"/>
</svg>
